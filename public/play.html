<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#05010f">
  <title>Neon Pong controller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="phone">
  <!-- Swipe areas, built by phone.js: one for ping pong, one per rod in soccer -->
  <div id="zones" class="zones hidden"></div>

  <!-- Top bar: my colour, the score, pause -->
  <div class="phone-top">
    <div id="badge" class="me-badge">P?</div>
    <div id="score" class="phone-score hidden">
      <span id="score-left" class="neon">0</span><span>:</span><span id="score-right" class="neon">0</span>
    </div>
    <button id="pause" class="pause-btn hidden" aria-label="Pause">❚❚</button>
  </div>

  <!-- Connecting / errors -->
  <section id="status" class="overlay solid">
    <p class="title">NEON PONG</p>
    <p id="status-text" class="medium pulse">Connecting…</p>
  </section>

  <!-- Who are you? Name and avatar, asked when the phone joins (remembered for next time) -->
  <section id="profile" class="overlay solid hidden">
    <p class="medium neon" style="color: var(--me)">Who are you?</p>
    <input id="name" class="name-input" type="text" maxlength="12" autocomplete="off"
           autocapitalize="words" spellcheck="false" placeholder="Your name" enterkeyhint="done">
    <div id="avatars" class="avatar-grid"></div>
    <button id="profile-done" class="go start-btn">Let's go!</button>
  </section>

  <!-- Lobby: choose mode & difficulty, start -->
  <section id="lobby" class="overlay hidden">
    <p id="you-are" class="medium neon" style="color: var(--me)">You!</p>
    <p class="small">Tap your picture at the top to change it</p>
    <div class="settings">
      <div class="row game-cards" data-setting="game">
        <button data-value="classic"><span class="icon">🏓</span>Ping Pong</button>
        <button data-value="soccer"><span class="icon">⚽</span>Soccer</button>
      </div>
      <div class="row" data-setting="mode">
        <button data-value="versus"><span class="icon">🧒⚡🧒</span>1 v 1</button>
        <button data-value="team"><span class="icon">🧒🧒⚡🤖</span>Team</button>
      </div>
      <div class="row" data-setting="difficulty">
        <button data-value="easy"><span class="icon">🐢</span>Easy</button>
        <button data-value="medium"><span class="icon">🐇</span>Medium</button>
        <button data-value="hard"><span class="icon">🚀</span>Hard</button>
      </div>
    </div>
    <button id="start" class="go start-btn">START</button>
    <p id="start-hint" class="small"></p>
  </section>

  <!-- Messages during a match -->
  <section id="message" class="overlay hidden" style="pointer-events: none">
    <p id="message-big" class="big neon"></p>
    <p id="message-small" class="medium"></p>
  </section>

  <!-- Paused: carry on, change the level, or go back to the main menu -->
  <section id="paused" class="overlay dim hidden">
    <p class="medium neon" style="color: var(--cpu)">PAUSED</p>
    <button id="resume" class="go huge-btn" aria-label="Resume">▶</button>
    <div class="settings">
      <div class="row" data-setting="difficulty">
        <button data-value="easy"><span class="icon">🐢</span>Easy</button>
        <button data-value="medium"><span class="icon">🐇</span>Medium</button>
        <button data-value="hard"><span class="icon">🚀</span>Hard</button>
      </div>
    </div>
    <button id="menu" class="menu-btn">🏠 Main menu</button>
  </section>

  <!-- Soccer kick-off: touch the circle, slide round to aim, let go to kick -->
  <section id="kick" class="overlay hidden">
    <p id="kick-title" class="medium neon" style="color: var(--me)">Your kick-off!</p>
    <div id="dial" class="dial">
      <div id="goal-mark" class="goal-mark right">🥅</div>
      <div id="dial-arrow" class="dial-arrow hidden"></div>
      <div class="dial-ball">⚽</div>
    </div>
    <p id="kick-hint" class="small">Touch the circle, slide round to aim, let go to kick!</p>
  </section>

  <!-- Game over -->
  <section id="over" class="overlay dim hidden">
    <p id="over-icon" class="big crowned">🏆</p>
    <p id="over-text" class="medium neon"></p>
    <div class="stack">
      <button id="again" class="go">Play again</button>
      <button id="change">Change settings</button>
    </div>
  </section>

  <script type="module" src="/js/phone.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#05010f">
  <title>Neon Pong</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <canvas id="court"></canvas>

  <div id="offline" class="banner hidden">Connecting to the server…</div>

  <!-- 1. Tap to start (lets the browser play sound) -->
  <section id="tap" class="overlay solid">
    <h1 class="title">NEON PONG</h1>
    <p class="medium neon pulse" style="color: var(--p1)">Tap to start</p>
    <p class="small rotate-hint">Turn the tablet sideways for the best view</p>
  </section>

  <!-- 2. Lobby: QR code, players, settings -->
  <section id="lobby" class="overlay dim hidden">
    <div class="lobby">
      <div class="qr-box">
        <img id="qr" class="qr" alt="QR code to join">
        <p class="medium" style="color: var(--p1)">Scan to play</p>
        <p class="room-code">Room <span id="room-code">----</span></p>
      </div>
      <div class="settings">
        <h1 class="title" style="font-size: clamp(26px, 4vw, 50px)">NEON PONG</h1>
        <div class="players">
          <div class="player-chip" id="chip-1" style="--c: var(--p1)"><span class="chip-name">P1</span><small>Waiting…</small></div>
          <div class="player-chip" id="chip-2" style="--c: var(--p2)"><span class="chip-name">P2</span><small>Waiting…</small></div>
        </div>
        <div>
          <h3>Game</h3>
          <div class="row game-cards" data-setting="game">
            <button data-value="classic"><span class="icon">🏓</span>Ping Pong</button>
            <button data-value="soccer"><span class="icon">⚽</span>Soccer</button>
          </div>
        </div>
        <div>
          <h3>Players</h3>
          <div class="row" data-setting="mode">
            <button data-value="versus">🧒 1 v 1 🧒</button>
            <button data-value="team">🧒🧒 Team v 🤖</button>
          </div>
        </div>
        <div>
          <h3>Difficulty</h3>
          <div class="row" data-setting="difficulty">
            <button data-value="easy">🐢 Easy</button>
            <button data-value="medium">🐇 Medium</button>
            <button data-value="hard">🚀 Hard</button>
          </div>
        </div>
        <button id="start" class="go start-btn">START</button>
        <p id="start-hint" class="small"></p>
      </div>
    </div>
  </section>

  <!-- 3. Messages during a match: countdown, paused, waiting for a player -->
  <section id="message" class="overlay hidden">
    <p id="message-big" class="big neon"></p>
    <p id="message-small" class="medium"></p>
    <img id="message-qr" class="qr small-qr hidden" alt="QR code to rejoin">
    <!-- Pause menu: carry on, change the level on the fly, or leave to the main menu -->
    <div id="pause-menu" class="pause-menu hidden">
      <button id="resume" class="go start-btn">▶ Resume</button>
      <div class="row" data-setting="difficulty">
        <button data-value="easy">🐢 Easy</button>
        <button data-value="medium">🐇 Medium</button>
        <button data-value="hard">🚀 Hard</button>
      </div>
    </div>
    <button id="menu" class="menu-btn hidden">🏠 Main menu</button>
  </section>

  <!-- Small message along the top: who kicks off, etc. -->
  <div id="hint" class="hint hidden"></div>

  <!-- 4. Winner celebration -->
  <section id="winner" class="overlay dim hidden">
    <p class="big pop-in">🏆</p>
    <p id="winner-text" class="big neon pop-in" style="font-size: clamp(40px, 8vw, 96px)"></p>
    <div class="row">
      <button id="again" class="go start-btn">Play again</button>
      <button id="change" class="start-btn">Change settings</button>
    </div>
  </section>

  <button id="pause" class="corner-btn hidden" aria-label="Pause">❚❚</button>
  <div id="stats" class="stats"></div>

  <script type="module" src="/js/tablet.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#05010f">
  <title>Neon Arcade controller</title>
  <link rel="preload" href="/fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/press-start-2p-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/platform.css">
  <link rel="stylesheet" href="/css/voxel.css">
</head>
<body class="phone">
  <!-- The controller: built by the controller kit from the game's layout -->
  <div id="controller" class="hidden"></div>

  <!-- Top bar: my avatar, the score, pause -->
  <div class="phone-top">
    <div id="badge" class="me-badge">…</div>
    <div id="score" class="phone-score hidden"></div>
    <button id="pause" class="pause-btn hidden" aria-label="Pause">❚❚</button>
  </div>

  <!-- A short message from the game ("🦁 Leo kicks off", countdown...) -->
  <div id="note" class="phone-note hidden"><span class="icon"></span><span class="text"></span></div>

  <!-- Connecting / errors -->
  <section id="status" class="overlay solid">
    <p class="title">NEON ARCADE</p>
    <p id="status-text" class="medium pulse">Connecting…</p>
  </section>

  <!-- Who are you? Nickname and avatar (remembered on this phone) -->
  <section id="profile" class="overlay solid hidden">
    <!-- Animals first: a child who can't read or type picks one and taps GO. -->
    <p class="medium neon pick-title" style="color: var(--me)">Pick your animal</p>
    <div id="avatars" class="avatar-grid"></div>
    <label class="name-optional" for="name">Your name <span>(you can skip this)</span></label>
    <input id="name" class="name-input small-name" type="text" maxlength="12" autocomplete="off"
           autocapitalize="words" spellcheck="false" placeholder="Name" enterkeyhint="done">
    <p id="name-hint" class="small hidden">Please pick another name</p>
    <button id="profile-done" class="go start-btn breathe">LET'S GO</button>
  </section>

  <!-- Lobby: pick a game, how to play it, and start -->
  <section id="lobby" class="overlay hidden">
    <p id="you-are" class="medium neon" style="color: var(--me)">Hi!</p>
    <p class="small">Tap your picture at the top to change it</p>
    <div class="settings">
      <div class="row boost-row" id="boost-row" aria-label="Help for younger players"></div>
    </div>
    <div class="settings" id="lobby-settings"></div>
    <div class="start-dock">
      <p id="start-hint" class="small"></p>
      <button id="start" class="go start-btn">START</button>
    </div>
  </section>

  <!-- Paused: carry on, change options, or go back to the games -->
  <section id="paused" class="overlay dim hidden">
    <p class="medium neon" style="color: var(--cpu)">PAUSED</p>
    <button id="resume" class="go huge-btn" aria-label="Resume">▶</button>
    <div class="settings" id="pause-settings"></div>
    <button id="menu" class="menu-btn" data-icon="🏠">Games</button>
  </section>

  <!-- Results -->
  <section id="results" class="overlay dim hidden">
    <p id="over-icon" class="big crowned">🏆</p>
    <p id="over-text" class="medium neon"></p>
    <p id="over-sub" class="small" hidden></p>
    <div class="row thumbs" id="thumbs">
      <button data-vote="up" aria-label="Liked it" data-icon="👍"></button>
      <button data-vote="down" aria-label="Didn't like it" data-icon="👎"></button>
    </div>
    <div class="stack">
      <button id="again" class="go" data-icon="🔁">PLAY AGAIN</button>
      <button id="change" data-icon="🏠">Games</button>
    </div>
  </section>

  <script type="module" src="/js/phone.js"></script>
</body>
</html>
